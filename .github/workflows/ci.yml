name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate UI and packaged assets
        run: python tools/check_ui.py

      - name: Verify clean-room runtime shim
        shell: pwsh
        run: |
          $expected = (Get-Content runtime/libc.prx.sha256).Split()[0].ToUpperInvariant()
          $actual = (Get-FileHash runtime/libc.prx -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "runtime/libc.prx hash mismatch" }

      - name: Fetch pinned SharpProspero tooling
        shell: pwsh
        run: ./tools/setup-tooling.ps1

      - name: Build host tooling
        shell: pwsh
        run: |
          dotnet build tooling/MinimalLibcBuilder/MinimalLibcBuilder.csproj -c Release
          dotnet build tooling/NativeAppBuilder/NativeAppBuilder.csproj -c Release
